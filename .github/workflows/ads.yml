name: AI ad review

# The model reads the whole account and proposes actions; the rule engine in
# adsmanager.py decides which of them are allowed to execute.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Execute proposals that pass the rules (otherwise propose only)"
        type: boolean
        default: false

concurrency:
  group: reelforge-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Review
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          AI_ADS_MODE: ${{ vars.AI_ADS_MODE }}
          MAX_ACCOUNT_DAILY_BUDGET_TRY: ${{ vars.MAX_ACCOUNT_DAILY_BUDGET_TRY }}
          PROTECTED_ENTITY_IDS: ${{ vars.PROTECTED_ENTITY_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: python -m reelforge ads ${{ inputs.apply && '--apply' || '' }}

      - name: Commit reports
        if: always()
        run: |
          if [ -z "$(git status --porcelain state reports)" ]; then exit 0; fi
          git config user.name "reelforge[bot]"
          git config user.email "reelforge@users.noreply.github.com"
          git add state reports
          git commit -m "chore(state): ads review [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

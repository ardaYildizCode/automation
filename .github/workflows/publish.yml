name: Publish trial reels

# Picks up the oldest unprocessed file in the Dropbox inbox, renders the ten
# variants and publishes them as trial reels.
on:
  schedule:
    # 06:00 UTC = 09:00 Europe/Istanbul
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render variants but publish nothing"
        type: boolean
        default: false

concurrency:
  group: reelforge-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1

      - name: Publish
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          DROPBOX_MUSIC: ${{ vars.DROPBOX_MUSIC }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          DROPBOX_INBOX: ${{ vars.DROPBOX_INBOX }}
          DROPBOX_PROCESSED: ${{ vars.DROPBOX_PROCESSED }}
          DROPBOX_RENDERS: ${{ vars.DROPBOX_RENDERS }}
          VARIANT_COUNT: ${{ vars.VARIANT_COUNT }}
          TRIAL_GRADUATION_STRATEGY: ${{ vars.TRIAL_GRADUATION_STRATEGY }}
          MAX_BATCHES_PER_DAY: ${{ vars.MAX_BATCHES_PER_DAY }}
          CAPTION_TEMPLATE: ${{ vars.CAPTION_TEMPLATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONPATH: src
        run: python -m reelforge publish

      - name: Commit state
        run: |
          if [ -z "$(git status --porcelain state reports)" ]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "reelforge[bot]"
          git config user.email "reelforge@users.noreply.github.com"
          git add state reports
          git commit -m "chore(state): publish run [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((2 ** attempt))
          done
          exit 1

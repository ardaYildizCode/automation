name: Onizleme (test)

# Renders the treatments into Dropbox and publishes nothing. Needs only the
# Dropbox secrets, so it is the cheapest way to see what the pipeline would
# post before any Instagram or Meta credential exists.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Inbox'taki dosya adi (bos birakirsan en yenisi)"
        required: false
        type: string
      count:
        description: "Kac varyant (bos = 10)"
        required: false
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ffmpeg -version | head -1

      - name: Render preview
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          # Publishing never happens here, but Config still wants these.
          IG_USER_ID: ${{ secrets.IG_USER_ID || 'unused' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || 'unused' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DROPBOX_INBOX: ${{ vars.DROPBOX_INBOX }}
          DROPBOX_MUSIC: ${{ vars.DROPBOX_MUSIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: |
          ARGS=""
          [ -n "${{ inputs.file }}" ] && ARGS="$ARGS --file '${{ inputs.file }}'"
          [ -n "${{ inputs.count }}" ] && ARGS="$ARGS --count ${{ inputs.count }}"
          eval python -m reelforge preview $ARGS

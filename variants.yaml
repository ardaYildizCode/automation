# The ten edits under test. Tune the numbers freely; `kind` selects the
# renderer in src/reelforge/editor.py and must stay one of:
#   control | trim_head | speed | zoom_punch | grade | text_hook
#   freeze_open | tight_crop
#
# Keep `control` first. Without an untouched baseline in the batch you cannot
# tell whether the edits helped or simply differed from each other.
#
# Captions are identical across all ten on purpose: the edit is the only
# variable, so the ranking measures the edit and nothing else.

variants:
  - key: control
    label: "Orijinal (kontrol)"
    kind: control

  - key: hook_trim
    label: "Hizli giris - ilk 1.5sn kesik"
    kind: trim_head
    params:
      seconds: 1.5

  - key: speed_up
    label: "%8 hizlandirilmis tempo"
    kind: speed
    params:
      factor: 1.08

  - key: zoom_punch
    label: "Yavas yakinlasma"
    kind: zoom_punch
    params:
      amount: 0.16      # 16% push-in across the clip

  # Grades stay conservative on purpose. Customers order by colour from these
  # videos, so a punchy render that misrepresents the fabric buys returns
  # rather than sales. Push these numbers only if you have checked a render
  # against the real garment.
  - key: bright_pop
    label: "Parlak / canli renk"
    kind: grade
    params:
      brightness: 0.04
      contrast: 1.08
      saturation: 1.10
      gamma: 0.98

  - key: warm_grade
    label: "Sicak ton"
    kind: grade
    params:
      brightness: 0.02
      contrast: 1.05
      saturation: 1.05
      temperature: 0.06   # positive = warmer

  - key: clean_grade
    label: "Temiz / soguk ton"
    kind: grade
    params:
      brightness: 0.02
      contrast: 1.06
      saturation: 1.00
      temperature: -0.05  # negative = cooler

  - key: text_hook
    label: "Ust yazi kancasi"
    kind: text_hook
    params:
      text: "ISTEDIGINIZ RENK VE BEDENDE"
      seconds: 3.0
      fontsize: 58

  - key: freeze_open
    label: "Donmus ilk kare"
    kind: freeze_open
    params:
      seconds: 0.8

  - key: tight_crop
    label: "Yakin cerceve"
    kind: tight_crop
    params:
      zoom: 1.18
